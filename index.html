<title>Монстрик на горке</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&display=swap">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #2d5e46;
    overflow: hidden;
  }
  body {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }
</style>

<canvas id="game" tabindex="0" aria-label="Игра «Монстрик на горке». Автор игры: Артем Смирнов, 7 лет."></canvas>

<script>
(() => {
  'use strict';

  // ---------- Холст ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(280, rect.width);
    H = Math.max(360, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Настройки ----------
  const FONT = 'Rubik, "Trebuchet MS", "Segoe UI", Arial, sans-serif';
  const AUTHOR = 'Автор игры: Артем Смирнов, 7 лет';
  const EDGE = 18;            // ширина полосы шипов у краёв горки
  const MONSTER_R = 24;       // радиус монстрика
  const MAX_SIDE_SPEED = 330; // как быстро монстрик едет вбок
  const RESTART_TIME = 3;     // через сколько секунд после проигрыша начнётся новая игра
  const NAVY = '#1d3b8f';
  const PINK = '#ff4f9a';
  const RED = '#e53935';
  const MUTED = '#5b6b8c';

  const MONSTERS = [
    { name: 'Голубой',    body: '#5ec8f2', belly: '#c4ecff', eye: '#2fbf4a', horn: '#2b8fc4' },
    { name: 'Зелёный',    body: '#5ad16a', belly: '#cbf5cc', eye: '#ff9f1c', horn: '#2e9a42' },
    { name: 'Синий',      body: '#3a5ee8', belly: '#aebdff', eye: '#ffd23f', horn: '#233a9e' },
    { name: 'Розовый',    body: '#ff85c0', belly: '#ffd6ec', eye: '#7b3fe4', horn: '#d94a93' },
    { name: 'Фиолетовый', body: '#9b6bff', belly: '#ddceff', eye: '#3ddc97', horn: '#6a3fd1' },
    { name: 'Оранжевый',  body: '#ff9a3c', belly: '#ffdcb5', eye: '#1e88e5', horn: '#d96b12' }
  ];

  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  // ---------- Рекорд ----------
  let best = 0;
  try {
    best = parseInt(localStorage.getItem('monster-slope-best') || '0', 10) || 0;
  } catch (e) {
    best = 0;
  }
  function saveBest() {
    try {
      localStorage.setItem('monster-slope-best', String(best));
    } catch (e) {
      // хранилище недоступно — рекорд живёт только до перезагрузки
    }
  }

  // ---------- Звук ----------
  let audio = null;
  function initAudio() {
    if (!audio) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audio = new AC();
      } catch (e) {
        audio = null;
      }
    }
    if (audio && audio.state === 'suspended') {
      audio.resume().catch(() => {});
    }
  }
  function tone(from, to, dur, type, vol) {
    if (!audio) return;
    try {
      const t = audio.currentTime;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(to, t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    } catch (e) {
      // без звука тоже можно играть
    }
  }
  function sound(name) {
    if (name === 'start') {
      tone(440, 880, 0.15, 'square', 0.06);
    } else if (name === 'lose') {
      tone(420, 80, 0.7, 'sawtooth', 0.1);
    } else if (name === 'ding') {
      tone(880, 1320, 0.14, 'triangle', 0.08);
    }
  }

  // ---------- Помощники ----------
  function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
  }
  function rnd(i) {
    const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function slope() {
    const sw = Math.min(W - 24, 480);
    const L = (W - sw) / 2;
    return { L: L, R: L + sw, PL: L + EDGE, PR: L + sw - EDGE };
  }
  function monsterY() {
    return Math.round(H * 0.28);
  }
  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.arcTo(x + w, y, x + w, y + rr, rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
    ctx.lineTo(x + rr, y + h);
    ctx.arcTo(x, y + h, x, y + h - rr, rr);
    ctx.lineTo(x, y + rr);
    ctx.arcTo(x, y, x + rr, y, rr);
    ctx.closePath();
  }
  function text(str, x, y, size, color, weight, align, stroke) {
    ctx.font = (weight || 800) + ' ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    if (stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, size * 0.18);
      ctx.strokeStyle = stroke;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  // ---------- Состояние игры ----------
  let state = 'title'; // 'title' | 'play' | 'lose'
  let monsterIndex = 0;
  let distance = 0;
  let speed = 0;
  let monster = { x: 0, vx: 0, alive: true };
  let obstacles = [];
  let particles = [];
  let trail = [];
  let nextSpawn = 0;
  let loseTime = 0;
  let shake = 0;
  let time = 0;
  let newRecord = false;
  let lastMilestone = 0;

  function score() {
    return Math.floor(distance / 40);
  }

  function startGame() {
    const s = slope();
    distance = 0;
    speed = 190;
    monster = { x: (s.PL + s.PR) / 2, vx: 0, alive: true };
    obstacles = [];
    particles = [];
    trail = [];
    nextSpawn = 420;
    loseTime = 0;
    shake = 0;
    newRecord = false;
    lastMilestone = 0;
    state = 'play';
    sound('start');
  }

  function nextMonster() {
    monsterIndex = (monsterIndex + 1) % MONSTERS.length;
  }

  function lose() {
    state = 'lose';
    loseTime = 0;
    monster.alive = false;
    shake = 14;
    const m = MONSTERS[monsterIndex];
    const colors = [m.body, m.belly, m.eye, m.horn, '#ffffff'];
    const my = monsterY();
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 120 + Math.random() * 260;
      particles.push({
        x: monster.x,
        y: my,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 120,
        life: 0.8 + Math.random() * 0.6,
        r: 3 + Math.random() * 5,
        color: colors[i % colors.length]
      });
    }
    const sc = score();
    if (sc > best) {
      best = sc;
      newRecord = sc > 0;
      saveBest();
    }
    sound('lose');
  }

  function spawnObstacle() {
    const s = slope();
    const lvl = Math.min(score() / 400, 1);
    const fromLeft = Math.random() < 0.5;
    const type = Math.random() < 0.3 + lvl * 0.2 ? 'ball' : 'bar';
    const w = type === 'bar' ? 64 + Math.random() * (40 + lvl * 30) : 0;
    const half = type === 'bar' ? w / 2 + 4 : 27;
    const sideSpeed = (70 + Math.random() * 80) * (1 + lvl * 1.1);
    obstacles.push({
      type: type,
      w: w,
      x: fromLeft ? s.PL + half : s.PR - half,
      y: H + 40,
      vx: fromLeft ? sideSpeed : -sideSpeed,
      rot: 0
    });
    nextSpawn = distance + Math.max(150, 250 - lvl * 90) + Math.random() * 90;
  }

  function obstacleHalfWidth(o) {
    return o.type === 'bar' ? o.w / 2 + 4 : 27;
  }

  function hits(o, mx, my) {
    const rr = MONSTER_R * 0.78;
    if (o.type === 'bar') {
      const hw = o.w / 2 + 2;
      const hh = 7 + 12 * 0.65;
      const cx = clamp(mx, o.x - hw, o.x + hw);
      const cy = clamp(my, o.y - hh, o.y + hh);
      const dx = mx - cx;
      const dy = my - cy;
      return dx * dx + dy * dy < rr * rr;
    }
    const R = 16 + 11 * 0.55;
    const dx = mx - o.x;
    const dy = my - o.y;
    return dx * dx + dy * dy < (rr + R) * (rr + R);
  }

  // ---------- Управление ----------
  const keys = { left: false, right: false };
  const pointers = new Map();

  function action() {
    initAudio();
    if (state === 'title') {
      startGame();
    } else if (state === 'lose' && loseTime > 0.7) {
      nextMonster();
      startGame();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      keys.left = true;
      e.preventDefault();
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      keys.right = true;
      e.preventDefault();
    } else if (e.code === 'Space' || e.code === 'Enter') {
      action();
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = false;
    keys.right = false;
    pointers.clear();
  });

  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    return e.clientX - rect.left;
  }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.focus();
    pointers.set(e.pointerId, pointerX(e));
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (err) {
      // не страшно
    }
    action();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, pointerX(e));
  });
  function releasePointer(e) {
    pointers.delete(e.pointerId);
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  function inputDir() {
    let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    pointers.forEach((x) => {
      dir += x < W / 2 ? -1 : 1;
    });
    return clamp(dir, -1, 1);
  }

  // ---------- Обновление ----------
  function update(dt) {
    time += dt;
    const s = slope();
    const my = monsterY();

    if (state === 'title') {
      distance += 60 * dt;
    }

    if (state === 'play') {
      const dir = inputDir();
      monster.vx += (dir * MAX_SIDE_SPEED - monster.vx) * Math.min(1, dt * 9);
      monster.x += monster.vx * dt;
      if (monster.x < s.PL + MONSTER_R) {
        monster.x = s.PL + MONSTER_R;
        monster.vx = 0;
      }
      if (monster.x > s.PR - MONSTER_R) {
        monster.x = s.PR - MONSTER_R;
        monster.vx = 0;
      }

      speed = Math.min(560, speed + dt * 7);
      distance += speed * dt;

      trail.push({ x: monster.x, d: distance });
      while (trail.length > 0 && my - (distance - trail[0].d) < -30) {
        trail.shift();
      }

      if (distance >= nextSpawn) spawnObstacle();

      for (const o of obstacles) {
        const half = obstacleHalfWidth(o);
        o.y -= speed * dt;
        o.x += o.vx * dt;
        if (o.x - half < s.PL) {
          o.x = s.PL + half;
          o.vx = Math.abs(o.vx);
        }
        if (o.x + half > s.PR) {
          o.x = s.PR - half;
          o.vx = -Math.abs(o.vx);
        }
        if (o.type === 'ball') o.rot += (o.vx / 27) * dt;
      }
      obstacles = obstacles.filter((o) => o.y > -60);

      for (const o of obstacles) {
        if (hits(o, monster.x, my)) {
          lose();
          break;
        }
      }

      const milestone = Math.floor(score() / 100);
      if (state === 'play' && milestone > lastMilestone) {
        lastMilestone = milestone;
        sound('ding');
      }
    }

    if (state === 'lose') {
      loseTime += dt;
      if (loseTime > RESTART_TIME) {
        nextMonster();
        startGame();
      }
    }

    for (const p of particles) {
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);

    shake = Math.max(0, shake - dt * 30);
  }

  // ---------- Рисование: горка ----------
  function drawTree(x, y, size) {
    ctx.fillStyle = 'rgba(15, 40, 28, 0.35)';
    ctx.beginPath();
    ctx.ellipse(x + 4, y + size * 0.55, size * 0.5, size * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b4a2f';
    ctx.fillRect(x - size * 0.08, y + size * 0.2, size * 0.16, size * 0.35);
    const layers = [
      { w: 0.62, top: -0.25, bottom: 0.3, color: '#1f5a3c' },
      { w: 0.5, top: -0.6, bottom: -0.02, color: '#28704b' },
      { w: 0.36, top: -0.95, bottom: -0.35, color: '#33875a' }
    ];
    for (const l of layers) {
      ctx.fillStyle = l.color;
      ctx.beginPath();
      ctx.moveTo(x, y + size * l.top);
      ctx.lineTo(x + size * l.w, y + size * l.bottom);
      ctx.lineTo(x - size * l.w, y + size * l.bottom);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#f4fbff';
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.95);
    ctx.lineTo(x + size * 0.14, y - size * 0.72);
    ctx.lineTo(x - size * 0.14, y - size * 0.72);
    ctx.closePath();
    ctx.fill();
  }

  function drawWorld() {
    const s = slope();

    // лес по бокам
    ctx.fillStyle = '#2d5e46';
    ctx.fillRect(0, 0, W, H);
    const rowH = 80;
    const k0 = Math.floor((distance - 80) / rowH);
    const k1 = Math.ceil((distance + H + 80) / rowH);
    for (let side = 0; side < 2; side++) {
      const areaW = s.L;
      if (areaW < 14) continue;
      const cols = Math.max(1, Math.floor(areaW / 90));
      for (let k = k0; k <= k1; k++) {
        for (let j = 0; j < cols; j++) {
          const seed = k * 13 + j * 7 + side * 997;
          const cx = (j + 0.2 + rnd(seed) * 0.6) * (areaW / cols);
          const x = side === 0 ? cx : s.R + cx;
          const y = k * rowH + rnd(seed + 3) * 40 - distance;
          drawTree(x, y, 22 + rnd(seed + 5) * 16);
        }
      }
    }

    // снежная горка
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#f6fbff');
    grad.addColorStop(1, '#d8ecfb');
    ctx.fillStyle = grad;
    ctx.fillRect(s.L, 0, s.R - s.L, H);

    // сугробики на горке
    const bumpH = 60;
    const b0 = Math.floor((distance - 40) / bumpH);
    const b1 = Math.ceil((distance + H + 40) / bumpH);
    for (let k = b0; k <= b1; k++) {
      const x = s.PL + 10 + rnd(k * 7.3) * (s.PR - s.PL - 20);
      const y = k * bumpH - distance;
      ctx.fillStyle = '#cfe3f3';
      ctx.beginPath();
      ctx.ellipse(x, y, 12 + rnd(k * 3.1) * 12, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x - 2, y - 1.5, 8 + rnd(k * 3.1) * 6, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // шипы по краям горки
    const step = 24;
    const off = ((distance % step) + step) % step;
    ctx.fillStyle = '#5c6477';
    ctx.fillRect(s.L, 0, 5, H);
    ctx.fillRect(s.R - 5, 0, 5, H);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#6f7a8f';
    ctx.fillStyle = '#d3d9e6';
    for (let y = -off - step; y < H + step; y += step) {
      ctx.beginPath();
      ctx.moveTo(s.L + 4, y);
      ctx.lineTo(s.PL + 5, y + step / 2);
      ctx.lineTo(s.L + 4, y + step);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s.R - 4, y);
      ctx.lineTo(s.PR - 5, y + step / 2);
      ctx.lineTo(s.R - 4, y + step);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawTrail() {
    if (trail.length < 2) return;
    const my = monsterY();
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(120, 170, 215, 0.35)';
    ctx.lineWidth = 16;
    ctx.beginPath();
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i];
      const y = my - (distance - p.d);
      if (i === trail.length - 1) ctx.moveTo(p.x, y);
      else ctx.lineTo(p.x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---------- Рисование: шипы ----------
  function drawBar(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.fillStyle = 'rgba(40, 70, 110, 0.15)';
    ctx.beginPath();
    ctx.ellipse(4, 24, o.w / 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const n = Math.max(3, Math.floor(o.w / 14));
    const sw = o.w / n;
    ctx.fillStyle = '#d3d9e6';
    ctx.strokeStyle = '#5f6a80';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < n; i++) {
      const x0 = -o.w / 2 + i * sw;
      ctx.beginPath();
      ctx.moveTo(x0, -6);
      ctx.lineTo(x0 + sw / 2, -19);
      ctx.lineTo(x0 + sw, -6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x0, 6);
      ctx.lineTo(x0 + sw / 2, 19);
      ctx.lineTo(x0 + sw, 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    roundRectPath(-o.w / 2 - 4, -8, o.w + 8, 16, 8);
    ctx.fillStyle = '#7a4a2b';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#4a2c18';
    ctx.stroke();
    ctx.fillStyle = '#a0663e';
    ctx.fillRect(-o.w / 2 + 2, -4, o.w - 4, 3);
    ctx.restore();
  }

  function drawBall(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.fillStyle = 'rgba(40, 70, 110, 0.15)';
    ctx.beginPath();
    ctx.ellipse(4, 26, 22, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(o.rot);
    ctx.fillStyle = '#d3d9e6';
    ctx.strokeStyle = '#5f6a80';
    ctx.lineWidth = 1.5;
    const spikes = 10;
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.24) * 14, Math.sin(a - 0.24) * 14);
      ctx.lineTo(Math.cos(a) * 27, Math.sin(a) * 27);
      ctx.lineTo(Math.cos(a + 0.24) * 14, Math.sin(a + 0.24) * 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#4a5163';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#2c3140';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-5, -5, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fill();
    ctx.restore();
  }

  // ---------- Рисование: монстрик ----------
  function drawMonster(x, y, r, m, opts) {
    const tilt = (opts && opts.tilt) || 0;
    const look = (opts && opts.look) || 0;
    const dead = !!(opts && opts.dead);
    const blink = !!(opts && opts.blink);

    ctx.save();
    ctx.translate(x, y);

    // тень
    ctx.fillStyle = 'rgba(40, 70, 110, 0.18)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.98, r * 0.9, r * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(tilt);

    // рожки
    ctx.fillStyle = m.horn;
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * r * 0.72, -r * 0.5);
      ctx.lineTo(sx * r * 0.6, -r * 1.25);
      ctx.lineTo(sx * r * 0.22, -r * 0.82);
      ctx.closePath();
      ctx.fill();
    }

    // лапки
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(sx * r * 0.45, r * 0.86, r * 0.28, r * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // тело
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.02, r * 0.96, 0, 0, Math.PI * 2);
    ctx.fillStyle = m.body;
    ctx.fill();
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    ctx.strokeStyle = 'rgba(20, 30, 60, 0.35)';
    ctx.stroke();

    // животик
    ctx.beginPath();
    ctx.ellipse(0, r * 0.38, r * 0.58, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = m.belly;
    ctx.fill();

    // глазки
    for (const sx of [-1, 1]) {
      const ex = sx * r * 0.38;
      const ey = -r * 0.2;
      ctx.beginPath();
      ctx.arc(ex, ey, r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.strokeStyle = 'rgba(20, 30, 60, 0.35)';
      ctx.stroke();

      if (dead) {
        ctx.strokeStyle = '#2a2033';
        ctx.lineWidth = Math.max(2, r * 0.09);
        ctx.lineCap = 'round';
        const d = r * 0.14;
        ctx.beginPath();
        ctx.moveTo(ex - d, ey - d);
        ctx.lineTo(ex + d, ey + d);
        ctx.moveTo(ex + d, ey - d);
        ctx.lineTo(ex - d, ey + d);
        ctx.stroke();
      } else if (blink) {
        ctx.strokeStyle = '#2a2033';
        ctx.lineWidth = Math.max(2, r * 0.08);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ex - r * 0.18, ey);
        ctx.lineTo(ex + r * 0.18, ey);
        ctx.stroke();
      } else {
        const ix = ex + look * r * 0.09;
        const iy = ey + r * 0.03;
        ctx.beginPath();
        ctx.arc(ix, iy, r * 0.19, 0, Math.PI * 2);
        ctx.fillStyle = m.eye;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ix, iy, r * 0.09, 0, Math.PI * 2);
        ctx.fillStyle = '#1a1422';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ix - r * 0.06, iy - r * 0.07, r * 0.05, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
    }

    // щёчки
    ctx.fillStyle = 'rgba(255, 110, 150, 0.45)';
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(sx * r * 0.66, r * 0.12, r * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    // ротик
    ctx.strokeStyle = '#3a2233';
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    ctx.lineCap = 'round';
    if (dead) {
      ctx.beginPath();
      ctx.ellipse(0, r * 0.3, r * 0.12, r * 0.14, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#3a2233';
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, r * 0.1, r * 0.26, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(r * 0.02, r * 0.33, r * 0.1, r * 0.1);
    }

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Рисование: надписи ----------
  function pill(str, x, y, align) {
    ctx.font = '800 17px ' + FONT;
    const w = ctx.measureText(str).width + 22;
    const left = align === 'right' ? x - w : x;
    roundRectPath(left, y - 16, w, 32, 16);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = NAVY;
    ctx.stroke();
    text(str, left + w / 2, y + 1, 17, NAVY, 800, 'center');
  }

  function drawHud() {
    const s = slope();
    pill(score() + ' м', s.PL + 6, 30, 'left');
    pill('Рекорд ' + best, s.PR - 6, 30, 'right');
  }

  function drawTouchArrows() {
    if (!isTouch) return;
    const dir = inputDir();
    const y = H - 60;
    const items = [{ x: 58, d: -1 }, { x: W - 58, d: 1 }];
    for (const it of items) {
      ctx.globalAlpha = dir === it.d ? 0.6 : 0.3;
      ctx.beginPath();
      ctx.arc(it.x, y, 34, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = NAVY;
      ctx.stroke();
      ctx.fillStyle = NAVY;
      ctx.beginPath();
      ctx.moveTo(it.x + it.d * 14, y);
      ctx.lineTo(it.x - it.d * 8, y - 14);
      ctx.lineTo(it.x - it.d * 8, y + 14);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function panel(x, y, w, h) {
    roundRectPath(x + 6, y + 8, w, h, 28);
    ctx.fillStyle = 'rgba(15, 30, 70, 0.25)';
    ctx.fill();
    roundRectPath(x, y, w, h, 28);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = NAVY;
    ctx.stroke();
  }

  function drawTitle() {
    const k = Math.min(1.15, (W - 32) / 360, (H - 24) / 490);
    const m = MONSTERS[monsterIndex];
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(k, k);
    panel(-180, -245, 360, 490);

    text('Монстрик', 0, -205, 46, NAVY);
    text('на горке', 0, -162, 34, PINK);

    const bounce = Math.abs(Math.sin(time * 3)) * -10;
    drawMonster(0, -88 + bounce, 42, m, {
      tilt: Math.sin(time * 1.6) * 0.12,
      look: Math.sin(time * 1.3),
      blink: (time % 3.2) < 0.12
    });

    for (let i = 0; i < MONSTERS.length; i++) {
      const px = (i - (MONSTERS.length - 1) / 2) * 46;
      if (i === monsterIndex) {
        ctx.beginPath();
        ctx.arc(px, -8, 21, 0, Math.PI * 2);
        ctx.fillStyle = '#ffe3f0';
        ctx.fill();
      }
      drawMonster(px, -8, 13, MONSTERS[i], { blink: ((time + i * 0.7) % 3.4) < 0.1 });
    }

    text('Катись вниз с горки', 0, 38, 19, '#33415c', 600);
    text('и не попадись на шипы!', 0, 62, 19, '#33415c', 600);

    const pulse = 1 + Math.sin(time * 4) * 0.03;
    ctx.save();
    ctx.translate(0, 118);
    ctx.scale(pulse, pulse);
    roundRectPath(-105, -30, 210, 60, 30);
    ctx.fillStyle = PINK;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = NAVY;
    ctx.stroke();
    text('ИГРАТЬ', 0, 2, 28, '#ffffff');
    ctx.restore();

    text(isTouch ? 'Держи палец слева или справа' : 'Стрелки ← → или A / D', 0, 172, 15, MUTED, 600);
    text(AUTHOR, 0, 214, 16, NAVY, 800);
    ctx.restore();
  }

  function drawLose() {
    const k = Math.min(1.1, (W - 32) / 340, (H - 24) / 390);
    const next = MONSTERS[(monsterIndex + 1) % MONSTERS.length];
    const appear = Math.min(1, loseTime * 4);
    ctx.save();
    ctx.translate(W / 2, H / 2 + (1 - appear) * 40);
    ctx.scale(k, k);
    ctx.globalAlpha = appear;
    panel(-170, -190, 340, 380);

    const wobble = Math.sin(loseTime * 12) * Math.max(0, 1 - loseTime) * 0.08;
    ctx.save();
    ctx.translate(0, -146);
    ctx.rotate(wobble);
    text('ПРОИГРЫШ!', 0, 0, 42, RED);
    ctx.restore();

    text('Ты проехал ' + score() + ' м', 0, -100, 22, NAVY);
    if (newRecord) {
      text('Новый рекорд!', 0, -68, 20, PINK);
    } else {
      text('Рекорд: ' + best + ' м', 0, -68, 18, MUTED, 600);
    }

    text('Следующий монстрик:', 0, -26, 18, '#33415c', 600);
    drawMonster(0, 28, 28, next, {
      tilt: Math.sin(time * 2) * 0.1,
      look: Math.sin(time * 1.5),
      blink: (time % 2.8) < 0.12
    });
    text(next.name, 0, 76, 22, NAVY);

    roundRectPath(-110, 104, 220, 12, 6);
    ctx.fillStyle = '#e3e9f5';
    ctx.fill();
    const prog = clamp(loseTime / RESTART_TIME, 0, 1);
    if (prog > 0.02) {
      roundRectPath(-110, 104, 220 * prog, 12, 6);
      ctx.fillStyle = PINK;
      ctx.fill();
    }
    text(isTouch ? 'Нажми, чтобы ехать сразу' : 'Нажми пробел, чтобы ехать сразу', 0, 136, 15, MUTED, 600);
    text(AUTHOR, 0, 168, 14, NAVY, 800);
    ctx.restore();
  }

  // ---------- Главный цикл ----------
  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawWorld();

    if (state !== 'title') {
      drawTrail();
      for (const o of obstacles) {
        if (o.type === 'bar') drawBar(o);
        else drawBall(o);
      }
      const m = MONSTERS[monsterIndex];
      const my = monsterY();
      if (state === 'play') {
        drawMonster(monster.x, my + Math.sin(time * 14) * 1.5, MONSTER_R, m, {
          tilt: (monster.vx / MAX_SIDE_SPEED) * 0.35,
          look: monster.vx / MAX_SIDE_SPEED,
          blink: (time % 3.2) < 0.12
        });
      } else {
        drawMonster(monster.x, my, MONSTER_R, m, { dead: true, tilt: 0.3 });
      }
      drawParticles();
    }
    ctx.restore();

    if (state === 'title') {
      drawTitle();
    } else {
      drawHud();
      if (state === 'play') drawTouchArrows();
      if (state === 'lose') drawLose();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
